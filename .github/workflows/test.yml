name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04            # ubuntu-latest 26.04: Python 3.9 yok (27.10)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    env:
      TURKCE_DUYGU_INDIRME: "0"
      TURKCE_USLUP_INDIRME: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: pytest -q
